apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bems-app-metrics-alerts
  namespace: monitoring
spec:
  groups:
    #
    # 목적: BEMS 애플리케이션이 노출하는 커스텀 메트릭(bems_*) 기반 알림 룰 템플릿.
    # 전제: FastAPI/Worker 등이 /metrics로 prometheus_client 메트릭을 노출하고,
    #      ServiceMonitor/PodMonitor로 스크랩한다.
    #
    # 주의: endpoint 라벨은 반드시 "템플릿 경로"(/documents/{id}) 수준으로 정규화해야 한다.
    #
    - name: bems.app.http
      rules:
        - alert: BEMSAppHttp5xxRateHigh
          expr: |
            (
              sum(rate(bems_api_http_requests_total{status_code=~"5.."}[5m]))
              /
              clamp_min(sum(rate(bems_api_http_requests_total[5m])), 1e-9)
            ) > 0.01
          for: 10m
          labels:
            severity: page
          annotations:
            summary: "BEMS 앱 5xx 비율 높음(>1%)"
            description: "bems_api_http_requests_total 기준 10분 이상 5xx 비율 1% 초과. 최근 배포/의존성(DB·검색) 확인."

        - alert: BEMSAppHttpLatencyP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(bems_api_http_request_duration_seconds_bucket[5m]))
            ) > 1.5
          for: 15m
          labels:
            severity: page
          annotations:
            summary: "BEMS 앱 p95 지연 높음(>1.5s)"
            description: "bems_api_http_request_duration_seconds_bucket 기준 15분 이상 p95 1.5초 초과."

        - alert: BEMSAppHttpInFlightTooHigh
          expr: |
            sum(bems_api_http_requests_in_progress) > 200
          for: 10m
          labels:
            severity: warn
          annotations:
            summary: "동시 처리(in-flight) 요청 증가"
            description: "10분 이상 in-flight 요청이 과도. 워커 증설/HPA/다운스트림 병목 확인."

    - name: bems.app.auth
      rules:
        - alert: BEMSAuthLoginFailuresHigh
          expr: |
            sum(rate(bems_auth_login_attempts_total{status="failed"}[5m])) > 2
          for: 10m
          labels:
            severity: warn
          annotations:
            summary: "로그인 실패 급증(브루트포스 의심)"
            description: "5분 평균 초당 2건 초과가 10분 지속. WAF/차단/계정 잠금 정책 확인."

    - name: bems.app.crawler
      rules:
        - alert: BEMSCrawlerHighFailureRate
          expr: |
            (
              sum(rate(bems_crawler_documents_collected_total{status="failed"}[15m]))
              /
              clamp_min(sum(rate(bems_crawler_documents_collected_total[15m])), 1e-9)
            ) > 0.05
          for: 30m
          labels:
            severity: warn
          annotations:
            summary: "크롤러 실패율 증가(>5%)"
            description: "15분 윈도우 기준 실패율 5% 초과가 30분 지속. 특정 소스 장애/차단/포맷 변경 확인."

        - alert: BEMSCrawlerDurationP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(bems_crawler_execution_duration_seconds_bucket[15m]))
            ) > 600
          for: 30m
          labels:
            severity: warn
          annotations:
            summary: "크롤러 실행시간 p95 증가(>10분)"
            description: "크롤링 지연. 네트워크/차단/리소스 부족 및 병렬성 설정 확인."

    - name: bems.app.simulation
      rules:
        - alert: BEMSSimulationFailureRateHigh
          expr: |
            (
              sum(rate(bems_simulation_executions_total{status="failed"}[15m]))
              /
              clamp_min(sum(rate(bems_simulation_executions_total[15m])), 1e-9)
            ) > 0.02
          for: 30m
          labels:
            severity: page
          annotations:
            summary: "시뮬레이션 실패율 증가(>2%)"
            description: "입력 검증/모델 파일/워커 리소스(OOM) 및 다운스트림 저장소 확인."

        - alert: BEMSSimulationDurationP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(bems_simulation_duration_seconds_bucket[15m]))
            ) > 1800
          for: 30m
          labels:
            severity: warn
          annotations:
            summary: "시뮬레이션 실행시간 p95 증가(>30분)"
            description: "워커/노드풀 부족 또는 입력 규모 증가 가능. 큐/병렬성/쿼터 점검."

    - name: bems.app.llm
      rules:
        - alert: BEMSLLMErrorRateHigh
          expr: |
            (
              sum(rate(bems_llm_requests_total{status!="success"}[15m]))
              /
              clamp_min(sum(rate(bems_llm_requests_total[15m])), 1e-9)
            ) > 0.02
          for: 30m
          labels:
            severity: warn
          annotations:
            summary: "LLM 호출 에러율 증가(>2%)"
            description: "벤더 장애/타임아웃/쿼터 초과 확인. 폴백(재시도/캐시) 및 비용 가드레일 점검."

        - alert: BEMSLLMLatencyP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(bems_llm_request_duration_seconds_bucket[15m]))
            ) > 30
          for: 30m
          labels:
            severity: warn
          annotations:
            summary: "LLM 지연 p95 증가(>30s)"
            description: "LLM 지연이 지속. 타임아웃/재시도 정책 및 동시성 제한 확인."

        - alert: BEMSLLMCostIncreasingFast
          expr: |
            increase(bems_llm_cost_usd_total[1h]) > 50
          for: 0m
          labels:
            severity: warn
          annotations:
            summary: "LLM 비용이 빠르게 증가(1시간 > $50)"
            description: "비용 폭주 가능. 사용자/기능별 쿼터 및 호출 경로(배치/자동) 확인."
