apiVersion: v1
kind: ServiceAccount
metadata:
  name: bems-worker
  namespace: bems-prod

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bems-worker
  namespace: bems-prod
  labels:
    app: bems-worker
    component: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: bems-worker
  template:
    metadata:
      labels:
        app: bems-worker
        component: worker
        version: v1.0.0
    spec:
      serviceAccountName: bems-worker
      containers:
        - name: worker
          image: bems/worker:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "modules.worker.consumer"]
          args:
            - "--concurrency=4"
            - "--queue=documents,simulations"
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: bems-config
            - secretRef:
                name: bems-secrets
          env:
            - name: POSTGRES_DSN
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: REDIS_DSN
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"
            - name: WORKER_TYPE
              value: "kafka_consumer"
            - name: CONSUMER_GROUP_ID
              value: "bems-workers"
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi

---
apiVersion: v1
kind: Service
metadata:
  name: bems-worker
  namespace: bems-prod
  labels:
    app: bems-worker
spec:
  type: ClusterIP
  selector:
    app: bems-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics

