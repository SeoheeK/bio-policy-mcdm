apiVersion: v1
kind: ServiceAccount
metadata:
  name: bems-api
  namespace: bems-prod

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bems-api
  namespace: bems-prod
  labels:
    app: bems-api
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bems-api
  template:
    metadata:
      labels:
        app: bems-api
        component: backend
        version: v1.0.0
    spec:
      serviceAccountName: bems-api
      initContainers:
        - name: db-migration
          image: bems/api:1.0.0
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: bems-config
            - secretRef:
                name: bems-secrets
          env:
            - name: POSTGRES_DSN
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

      containers:
        - name: api
          image: bems/api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: bems-config
            - secretRef:
                name: bems-secrets
          env:
            - name: POSTGRES_DSN
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: REDIS_DSN
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"
            - name: S3_ACCESS_KEY
              value: "$(MINIO_ACCESS_KEY)"
            - name: S3_SECRET_KEY
              value: "$(MINIO_SECRET_KEY)"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 10
            failureThreshold: 30

---
apiVersion: v1
kind: Service
metadata:
  name: bems-api
  namespace: bems-prod
  labels:
    app: bems-api
spec:
  type: ClusterIP
  selector:
    app: bems-api
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics

