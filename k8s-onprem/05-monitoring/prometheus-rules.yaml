apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bems-alerts
  namespace: bems-prod
  labels:
    # NOTE: kube-prometheus-stack의 ruleSelector에 맞게 조정 필요(대부분 release 라벨 사용)
    release: kube-prometheus-stack
spec:
  groups:
    - name: bems.app.http
      interval: 30s
      rules:
        - alert: BEMSAppHttp5xxRateHigh
          expr: |
            (
              sum(rate(bems_api_http_requests_total{status_code=~"5.."}[5m]))
              /
              clamp_min(sum(rate(bems_api_http_requests_total[5m])), 1e-9)
            ) > 0.01
          for: 10m
          labels:
            severity: page
            service: bems-api
          annotations:
            summary: "BEMS API 5xx 비율 높음(>1%)"
            description: "10분 이상 5xx 비율이 1%를 초과했습니다. 최근 배포/DB/검색/큐 지연을 점검하세요."

        - alert: BEMSAppHttpLatencyP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, endpoint) (rate(bems_api_http_request_duration_seconds_bucket[5m]))
            ) > 1.5
          for: 15m
          labels:
            severity: page
            service: bems-api
          annotations:
            summary: "BEMS API p95 지연 높음(>1.5s)"
            description: "15분 이상 p95 응답시간이 1.5초를 초과했습니다. endpoint 라벨 정규화(템플릿 경로) 여부도 확인하세요."

    - name: bems.app.auth
      interval: 60s
      rules:
        - alert: BEMSAuthLoginFailuresHigh
          expr: |
            sum(rate(bems_auth_login_attempts_total{status="failed"}[5m])) > 2
          for: 10m
          labels:
            severity: warn
            service: bems-auth
          annotations:
            summary: "로그인 실패 급증(브루트포스 의심)"
            description: "5분 평균 초당 2건 초과가 10분 지속. WAF/차단/계정잠금 정책 확인."

    - name: bems.app.queue
      interval: 60s
      rules:
        - alert: BEMSQueueLagHigh
          expr: |
            max(bems_queue_lag) > 10000
          for: 10m
          labels:
            severity: page
            service: bems-worker
          annotations:
            summary: "큐 lag 증가(>10,000)"
            description: "10분 이상 queue lag 임계치 초과. 워커 장애/리소스 부족/다운스트림 지연 확인."

        - alert: BEMSDLQOrFailuresRateHigh
          expr: |
            sum(rate(bems_queue_messages_total{status="failed"}[15m])) > 1
          for: 30m
          labels:
            severity: warn
            service: bems-worker
          annotations:
            summary: "메시지 처리 실패 증가(>1 msg/s)"
            description: "DLQ 유입 증가 가능. 에러 타입/배포 변경/스키마 불일치 확인."

    - name: bems.app.simulation
      interval: 60s
      rules:
        - alert: BEMSSimulationFailureRateHigh
          expr: |
            (
              sum(rate(bems_simulation_executions_total{status="failed"}[15m]))
              /
              clamp_min(sum(rate(bems_simulation_executions_total[15m])), 1e-9)
            ) > 0.02
          for: 30m
          labels:
            severity: page
            service: bems-simulation
          annotations:
            summary: "시뮬레이션 실패율 증가(>2%)"
            description: "입력 검증/모델 파일/워커 리소스(OOM) 및 저장소/DB 장애 확인."

        - alert: BEMSSimulationDurationP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, model_name) (rate(bems_simulation_duration_seconds_bucket[15m]))
            ) > 1800
          for: 30m
          labels:
            severity: warn
            service: bems-simulation
          annotations:
            summary: "시뮬레이션 실행시간 p95 증가(>30분)"
            description: "워커/노드풀 부족 또는 입력 규모 증가 가능. 병렬성/쿼터 점검."

    - name: bems.app.llm
      interval: 300s
      rules:
        - alert: BEMSLLMErrorRateHigh
          expr: |
            (
              sum(rate(bems_llm_requests_total{status!="success"}[15m]))
              /
              clamp_min(sum(rate(bems_llm_requests_total[15m])), 1e-9)
            ) > 0.02
          for: 30m
          labels:
            severity: warn
            service: bems-llm
          annotations:
            summary: "LLM 호출 에러율 증가(>2%)"
            description: "벤더 장애/타임아웃/쿼터 초과 확인. 폴백/재시도 및 비용 가드레일 점검."

        - alert: BEMSLLMCostIncreasingFast
          expr: |
            increase(bems_llm_cost_usd_total[1h]) > 50
          for: 0m
          labels:
            severity: warn
            service: bems-llm
          annotations:
            summary: "LLM 비용 급증(1시간 > $50)"
            description: "비용 폭주 가능. 사용자/기능별 쿼터 및 호출 경로(배치/자동) 확인."

    - name: bems.kubernetes.availability
      interval: 60s
      rules:
        - alert: BEMSApiReplicasLow
          expr: |
            (
              kube_deployment_status_replicas_available{namespace="bems-prod", deployment="bems-api"}
              /
              clamp_min(kube_deployment_spec_replicas{namespace="bems-prod", deployment="bems-api"}, 1)
            ) < 0.75
          for: 10m
          labels:
            severity: page
            service: bems-api
          annotations:
            summary: "API 가용 replicas 비율 저하(<75%)"
            description: "10분 이상 가용 replicas 비율이 낮습니다. 노드/스케줄링/프로브/리소스 확인."

