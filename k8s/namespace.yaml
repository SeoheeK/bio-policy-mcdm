apiVersion: v1
kind: Namespace
metadata:
  name: bems
  labels:
    name: bems
    environment: production

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bems-quota
  namespace: bems
spec:
  hard:
    requests.cpu: "50"
    requests.memory: 128Gi
    limits.cpu: "100"
    limits.memory: 256Gi
    persistentvolumeclaims: "20"
    services.loadbalancers: "2"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: bems-limitrange
  namespace: bems
spec:
  limits:
    - type: Pod
      max:
        cpu: "8"
        memory: 16Gi
      min:
        cpu: 100m
        memory: 128Mi

    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 50m
        memory: 64Mi
