apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bems-api-hpa
  namespace: bems
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bems-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    # Phase 1-2 권고(옵션 C): CPU/메모리만 사용하여 안정화 우선
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Min

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bems-worker-hpa
  namespace: bems
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bems-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

#
# Phase 3(또는 Phase 2 이후) 확장:
# - KEDA(권장) 또는 Prometheus Adapter를 도입해 Kafka lag / RPS 기반 스케일링을 추가.
# - 이 경우 HPA 대신 KEDA ScaledObject로 전환하거나, HPA External metric adapter를 구성.
#
