apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bems-secrets
  namespace: bems
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: bems-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # NOTE: remoteRef.key는 AWS Secrets Manager의 secret name 또는 ARN.
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: bems/prod/postgres
        property: password
    - secretKey: MONGODB_PASSWORD
      remoteRef:
        key: bems/prod/mongodb
        property: password
    - secretKey: NEO4J_PASSWORD
      remoteRef:
        key: bems/prod/neo4j
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: bems/prod/redis
        property: password
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: bems/prod/minio
        property: access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: bems/prod/minio
        property: secret_key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: bems/prod/openai
        property: api_key
    - secretKey: SECRET_KEY
      remoteRef:
        key: bems/prod/jwt
        property: secret_key

