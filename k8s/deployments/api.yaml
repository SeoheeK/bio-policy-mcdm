apiVersion: v1
kind: ServiceAccount
metadata:
  name: bems-api
  namespace: bems

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bems-api
  namespace: bems
  labels:
    app: bems-api
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bems-api
  template:
    metadata:
      labels:
        app: bems-api
        component: backend
        version: v1.0.0
    spec:
      serviceAccountName: bems-api

      # Init Container (DB 마이그레이션)
      initContainers:
        - name: db-migration
          image: bems/api:1.0.0
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: bems-config
            - secretRef:
                name: bems-secrets

      containers:
        - name: api
          image: bems/api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bems-config
            - secretRef:
                name: bems-secrets
          env:
            # DSN은 env.value에서 $(VAR) 확장을 사용(Secret과 결합)
            - name: POSTGRES_DSN
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: MONGODB_DSN
              value: "mongodb://$(MONGODB_USER):$(MONGODB_PASSWORD)@$(MONGODB_HOST):$(MONGODB_PORT)/$(MONGODB_DB)"
            - name: REDIS_DSN
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi

          # 헬스 체크 (앱에서 실제 엔드포인트 제공 필요)
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # Pod 분산 배치(노드 단위)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["bems-api"]
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: bems-api
  namespace: bems
  labels:
    app: bems-api
spec:
  type: ClusterIP
  selector:
    app: bems-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
