apiVersion: v1
kind: ConfigMap
metadata:
  name: bems-config
  namespace: bems
data:
  # 환경 설정
  ENV: "production"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # 권고: host/port 대신 DSN 단일값을 사용(운영/변경 용이)
  # 실제 값은 환경별로 주입하세요.
  POSTGRES_DSN: "postgresql://bems_user:${POSTGRES_PASSWORD}@postgres.bems.svc.cluster.local:5432/bems"
  MONGODB_DSN: "mongodb://bems_user:${MONGODB_PASSWORD}@mongodb.bems.svc.cluster.local:27017/bems_documents"
  NEO4J_URI: "bolt://neo4j.bems.svc.cluster.local:7687"
  REDIS_DSN: "redis://:${REDIS_PASSWORD}@redis.bems.svc.cluster.local:6379/0"
  OPENSEARCH_HOSTS: "http://opensearch.bems.svc.cluster.local:9200"
  QDRANT_HOST: "qdrant.bems.svc.cluster.local"
  QDRANT_PORT: "6333"
  MINIO_ENDPOINT: "minio.bems.svc.cluster.local:9000"

  # 성능 설정
  MAX_WORKERS: "4"
  DB_POOL_SIZE: "20"
  CACHE_TTL_SECONDS: "300"

  # 메트릭
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"

  # 가드레일
  SIMULATION_DAILY_LIMIT: "100"
  SIMULATION_CONCURRENT_LIMIT: "5"
  LLM_DAILY_BUDGET_USD: "100.0"
