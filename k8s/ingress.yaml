apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bems-ingress
  namespace: bems
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate Limiting (예시)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # CORS (예시)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://bems.kribb.re.kr"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

    # Body Size
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

    # SSL
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bems.kribb.re.kr
        - api.bems.kribb.re.kr
      secretName: bems-tls-cert
  rules:
    - host: bems.kribb.re.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bems-frontend
                port:
                  number: 80

    - host: api.bems.kribb.re.kr
      http:
        paths:
          # NOTE: rewrite-target을 사용하지 않고 prefix 그대로 전달(권고)
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: bems-api
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: bems-api
                port:
                  number: 80

          # NOTE: /metrics는 Ingress로 노출하지 않는 것을 권고(ServiceMonitor로 내부 수집).
