global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets:
          # App/DB/Storage 노드들에 node_exporter 배포 필요
          - "10.10.21.10:9100"
          - "10.10.21.11:9100"
          - "10.10.21.20:9100"
          - "10.10.21.21:9100"
          - "10.10.21.22:9100"
          - "10.10.21.30:9100"
          - "10.10.21.31:9100"
          - "10.10.21.32:9100"
          - "10.10.21.50:9100"
          - "10.10.21.51:9100"
          - "10.10.21.52:9100"
          - "10.10.21.55:9100"
          - "10.10.21.56:9100"
          - "10.10.21.57:9100"
          - "10.10.21.60:9100"
          - "10.10.21.61:9100"
          - "10.10.31.10:9100"
          - "10.10.31.11:9100"
          - "10.10.31.12:9100"
          - "10.10.31.13:9100"

  - job_name: "postgres"
    static_configs:
      - targets:
          - "10.10.21.10:9187"

  - job_name: "mongodb"
    static_configs:
      - targets:
          - "10.10.21.20:9216"

  - job_name: "redis"
    static_configs:
      - targets:
          - "10.10.21.40:9121"
          - "10.10.21.41:9121"
          - "10.10.21.42:9121"
          - "10.10.21.43:9121"
          - "10.10.21.44:9121"
          - "10.10.21.45:9121"

