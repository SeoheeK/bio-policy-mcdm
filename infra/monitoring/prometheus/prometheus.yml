global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets:
          # App/DB/Storage 노드들에 node_exporter 배포 필요
          - "10.10.21.10:9100"
          - "10.10.21.11:9100"
          - "10.10.21.20:9100"
          - "10.10.21.21:9100"
          - "10.10.21.22:9100"
          - "10.10.21.30:9100"
          - "10.10.21.31:9100"
          - "10.10.21.32:9100"
          - "10.10.21.50:9100"
          - "10.10.21.51:9100"
          - "10.10.21.52:9100"
          - "10.10.21.55:9100"
          - "10.10.21.56:9100"
          - "10.10.21.57:9100"
          - "10.10.21.60:9100"
          - "10.10.21.61:9100"
          - "10.10.31.10:9100"
          - "10.10.31.11:9100"
          - "10.10.31.12:9100"
          - "10.10.31.13:9100"

  - job_name: "postgres"
    static_configs:
      - targets:
          - "10.10.21.10:9187"

  - job_name: "mongodb"
    static_configs:
      - targets:
          - "10.10.21.20:9216"

  - job_name: "redis"
    static_configs:
      - targets:
          - "10.10.21.40:9121"
          - "10.10.21.41:9121"
          - "10.10.21.42:9121"
          - "10.10.21.43:9121"
          - "10.10.21.44:9121"
          - "10.10.21.45:9121"

  # OpenSearch (exporter)
  - job_name: "opensearch"
    static_configs:
      - targets:
          # exporter를 OpenSearch 노드(또는 별도 노드)에 배포
          - "10.10.21.50:9114"

  # Neo4j (내장 Prometheus endpoint)
  - job_name: "neo4j"
    static_configs:
      - targets:
          - "10.10.21.30:2004"
          - "10.10.21.31:2004"
          - "10.10.21.32:2004"

  # Qdrant (내장 /metrics)
  - job_name: "qdrant"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "10.10.21.60:6333"
          - "10.10.21.61:6333"

  # MinIO (내장 metrics)
  # - 기본 경로: /minio/v2/metrics/cluster
  # - 운영에서 인증을 붙일 수 있음(공개 수집 시 MINIO_PROMETHEUS_AUTH_TYPE=public 설정)
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets:
          - "10.10.31.10:9000"
          - "10.10.31.11:9000"
          - "10.10.31.12:9000"
          - "10.10.31.13:9000"

