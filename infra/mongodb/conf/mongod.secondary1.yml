systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen

storage:
  dbPath: /data/mongodb
  journal:
    enabled: true
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 64
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

processManagement:
  fork: false

net:
  port: 27017
  bindIp: 10.10.21.21,127.0.0.1
  maxIncomingConnections: 500

replication:
  replSetName: bems-replica-set

security:
  authorization: enabled
  keyFile: /etc/mongodb-keyfile

